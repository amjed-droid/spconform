url: https://amjed-droid.github.io/spconform/

template:
  bootstrap: 5
  bslib:
    primary: "#2c3e50"
    navbar-background: "#f8f9fa"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Fira Code"}

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]
  links:
    - text: Report a bug
      href: https://github.com/amjed-droid/spconform/issues
    - text: CRAN (coming soon)
      href: https://cran.r-project.org/package=spconform

navbar:
  structure:
    left:  [intro, reference, articles, news, help]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/spconform-intro.html
    articles:
      text: Articles
      menu:
        - text: Introduction to spconform
          href: articles/spconform-intro.html
    help:
      text: Help
      href: articles/getting-help.html
    github:
      icon: fab fa-github
      href: https://github.com/amjed-droid/spconform
      aria-label: GitHub

reference:
  - title: "Core functions"
    desc: "Main spatial and spatio-temporal conformal prediction procedures"
    contents:
      - scp_geostatistical
      - scp_areal

  - title: "Spatial Diagnostics"
    desc: "Multi-panel diagnostic tools, spatial strata auditing, and coverage evaluation"
    contents:
      - diagnose
      - coverage_report

  - title: "Helper functions"
    desc: "Kernel weights and graph-distance utilities"
    contents:
      - spatial_kernel_weights
      - areal_neighbor_weights

  - title: "S3 methods"
    desc: "Print, summary, and plot methods for spconform and diagnose objects"
    contents:
      - matches("print\\.|summary\\.|plot\\.")

footer:
  structure: 
    left: developed_by
    right: built_with
  components:
    developed_by: |
      Developed by **Ahmed Sattar Jabbar** · 
      <a href="https://doi.org/10.5281/zenodo.21862025">Zenodo</a>
      
      
      

      